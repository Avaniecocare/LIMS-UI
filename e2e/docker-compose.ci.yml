# The pinned backend for the end-to-end job in CI: PostgreSQL, Redis, an S3 store, the API and the worker.
# Every company value here is fictional. Start with: docker compose -f e2e/docker-compose.ci.yml up -d --wait
name: lims-ui-e2e
x-app: &app
  image: ${LIMS_IMAGE:?set LIMS_IMAGE to the backend image to test against}
  volumes:
    - ./branding:/app/e2e-branding:ro
    # The assistant's index: build docs-site before starting this stack.
    - ../docs-site/dist:/app/e2e-docs:ro
  environment: &env
    NODE_ENV: production
    PORT: '3000'
    DATABASE_URL: postgresql://lims:lims@postgres:5432/lims
    DATABASE_POOL_SIZE: '10'
    REDIS_URL: redis://redis:6379/0
    SESSION_SECRET: ci-only-session-value-with-no-use-outside-this-job
    SESSION_IDLE_MINUTES: '30'
    COOKIE_SECURE: 'false'
    FRONTEND_ORIGIN: http://localhost:5173
    PUBLIC_API_URL: http://localhost:3000
    TRUST_PROXY: 'false'
    S3_ENDPOINT: http://s3:9000
    S3_PUBLIC_ENDPOINT: http://localhost:9000
    S3_REGION: us-east-1
    S3_BUCKET: lims
    S3_ACCESS_KEY: S3RVER
    S3_SECRET_KEY: S3RVER
    S3_FORCE_PATH_STYLE: 'true'
    SMTP_HOST: localhost
    SMTP_PORT: '1025'
    SMTP_SECURE: 'false'
    SMTP_FROM: lab@testhouse.example
    SMTP_TRANSPORT: json
    WHATSAPP_TRANSPORT: json
    # Test IRNs and offline assistant answers: nothing leaves the machine.
    EINVOICE_PROVIDER: mock
    ENABLE_AI_ASSISTANT: 'true'
    AI_PROVIDER: mock
    HELP_INDEX_PATH: /app/e2e-docs/help-index.json
    LOG_LEVEL: info
    COMPANY_PRODUCT_NAME: 'Example Test House LIMS'
    COMPANY_NAME: 'Example Test House'
    COMPANY_LEGAL_NAME: 'Example Test House Private Limited'
    COMPANY_GSTIN: '27AAAAA0000A1Z2'
    COMPANY_PAN: 'AAAAA0000A'
    COMPANY_CIN: 'U74999MH2020PTC000000'
    COMPANY_STATE: 'Maharashtra'
    COMPANY_GST_STATE_CODE: '27'
    COMPANY_SAC_CODE: '998346'
    COMPANY_SAC_DESCRIPTION: 'Technical testing and analysis services'
    COMPANY_REGISTERED_ADDRESS: 'Unit 1, Example Industrial Estate, Pune 411001'
    COMPANY_LAB_ADDRESS: 'Unit 1, Example Industrial Estate, Pune 411001'
    COMPANY_PHONE: '+91 20 0000 0000'
    COMPANY_EMAIL: lab@testhouse.example
    COMPANY_WEBSITE: https://testhouse.example
    COMPANY_REPORT_VERIFICATION_EMAIL: verify@testhouse.example
    COMPANY_BANK_ACCOUNT_NAME: 'Example Test House Private Limited'
    COMPANY_BANK_ACCOUNT_NUMBER: '000000000000'
    COMPANY_BANK_NAME: 'Example Bank'
    COMPANY_BANK_BRANCH: 'Pune Main'
    COMPANY_BANK_IFSC: EXMP0000001
    COMPANY_BRANDING_DIR: /app/e2e-branding
    COMPANY_LOGO_PATH: logo.png
    COMPANY_FAVICON_PATH: favicon.png
    COMPANY_PRIMARY_COLOR: '#0f4c81'
    COMPANY_ACCENT_COLOR: '#0e9f6e'
    COMPANY_NABL_MODE: 'off'
    COMPANY_DOCUMENT_PREFIX: ET
services:
  postgres:
    image: postgres:18-alpine
    environment: { POSTGRES_USER: lims, POSTGRES_PASSWORD: lims, POSTGRES_DB: lims }
    healthcheck: { test: ['CMD-SHELL', 'pg_isready -U lims'], interval: 3s, timeout: 3s, retries: 30 }
  redis:
    image: redis:8-alpine
    healthcheck: { test: ['CMD', 'redis-cli', 'ping'], interval: 3s, timeout: 3s, retries: 30 }
  # Official MinIO images are no longer published, so this is a small s3rver built here.
  s3:
    build:
      context: .
      dockerfile_inline: |
        FROM node:24-alpine
        WORKDIR /srv
        RUN npm init -y >/dev/null && npm i s3rver@3.7.1
        RUN printf '%s\n' "const S3rver = require('s3rver');" "new S3rver({ port: 9000, address: '0.0.0.0', silent: true, directory: '/tmp/s3', vhostBuckets: false, allowMismatchedSignatures: true, configureBuckets: [{ name: 'lims' }] }).run().then(() => console.log('s3rver on 9000'));" > server.js
        CMD ["node", "server.js"]
    ports: ['9000:9000']
    healthcheck:
      test: ['CMD', 'node', '-e', "require('net').connect(9000, '127.0.0.1').on('connect', () => process.exit(0)).on('error', () => process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 30
  # Migrations run before the API starts, as it cannot boot without its schema. The seed needs the
  # roles the API creates on first start, so CI runs it afterwards with `docker compose exec`.
  api:
    <<: *app
    command: ['sh', '-c', 'npx prisma migrate deploy && exec node dist/main.js api']
    ports: ['3000:3000']
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      s3: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:3000/health/ready').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      start_period: 60s
      retries: 30
  worker:
    <<: *app
    command: ['node', 'dist/main.js', 'worker']
    healthcheck: { disable: true }
    depends_on:
      api: { condition: service_healthy }
