name: CI
on:
  push:
    branches: [main, 'build/**']
    tags: ['v*']
  pull_request:
permissions:
  contents: read
env:
  # Backend image the end-to-end test runs against: the repository variable LIMS_PINNED_VERSION
  # (an exact release, e.g. 0.1.0) when set, otherwise one built here from the branch of the same name, or main.
  LIMS_IMAGE: ghcr.io/avaniecocare/lims:${{ vars.LIMS_PINNED_VERSION || 'from-source' }}
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    env:
      # The gitleaks CLI itself (MIT), not gitleaks-action, which needs a paid licence on org repos.
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb # linux_x64 tarball
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0 }
      - name: Install gitleaks (pinned, checksum verified)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tar.gz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan the full history
        run: '"$RUNNER_TEMP/gitleaks" git --redact --verbose --exit-code 1 .'
  docs:
    # The help site: renderer tests, a full build (API reference, search index) and a broken-link check.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0 } # "Last updated" dates come from git history
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 24, cache: npm, cache-dependency-path: docs-site/package-lock.json }
      - run: npm ci
        working-directory: docs-site
      - name: Audit the help site's dependencies
        run: npm audit --omit=dev --audit-level=high
        working-directory: docs-site
      - run: npm test
        working-directory: docs-site
      - run: npm run build
        working-directory: docs-site
      - run: npm run check:links
        working-directory: docs-site
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run format:check
      - name: Unused files, exports and dependencies
        run: npm run knip
      - run: npm run typecheck
      - run: npm run api:check
      - run: npm test
      - run: npm run build
      - run: npm run size:check
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    env:
      E2E_BASE_URL: http://localhost:5173
      E2E_API_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 24, cache: npm }
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      # The backend's packages are private to its own repository, but its source is not.
      - name: The branch of the backend to test against
        id: backend
        if: vars.LIMS_PINNED_VERSION == ''
        # Needed only if the repositories are private: a token that can read LIMS.
        env: { TOKEN: '${{ secrets.LIMS_READ_TOKEN || github.token }}' }
        run: |
          url="https://x-access-token:$TOKEN@github.com/$GITHUB_REPOSITORY_OWNER/LIMS.git"; ref=main
          for r in "$GITHUB_HEAD_REF" "$GITHUB_REF_NAME"; do
            if [ -n "$r" ] && git ls-remote --exit-code --heads "$url" "$r" >/dev/null; then ref="$r"; break; fi
          done
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: vars.LIMS_PINNED_VERSION == ''
        with: { repository: '${{ github.repository_owner }}/LIMS', ref: '${{ steps.backend.outputs.ref }}', path: .backend, token: '${{ secrets.LIMS_READ_TOKEN || github.token }}' }
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        if: vars.LIMS_PINNED_VERSION == ''
        with:
          context: .backend
          load: true
          tags: ${{ env.LIMS_IMAGE }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Pull the backend image
        if: vars.LIMS_PINNED_VERSION != ''
        run: docker pull "$LIMS_IMAGE"
      - name: Build the help site
        run: npm ci && npm run build
        working-directory: docs-site
      - name: Start the pinned backend
        run: docker compose -f e2e/docker-compose.ci.yml up -d --wait
      - name: Load the demo data
        run: docker compose -f e2e/docker-compose.ci.yml exec -T api node dist/seed/cli.js seed
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Serve the built UI, with the help site at /help
        run: |
          npm --prefix docs-site run preview &
          npx vite preview --port 5173 --strictPort &
          timeout 60 sh -c 'until curl -sf http://localhost:5173 >/dev/null && curl -sf http://localhost:5173/help/ >/dev/null; do sleep 1; done'
      - run: npx playwright test
      - name: Backend logs
        if: failure()
        run: docker compose -f e2e/docker-compose.ci.yml logs --no-color --tail=300 api worker
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
  image:
    if: github.event_name == 'push'
    # Publish only what passed the end-to-end run too.
    needs: [gitleaks, verify, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # For the few commands in the final nginx stage; the Node stages run on the build machine's own platform.
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        id: meta
        with:
          images: ghcr.io/avaniecocare/lims-ui
          tags: |
            type=semver,pattern={{version}}
            type=ref,event=branch,enable=${{ startsWith(github.ref, 'refs/heads/build/') }}
            type=sha,format=long
      # Known vulnerabilities, of high severity or worse, that have a fix. Nothing is published until it passes.
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          load: true
          tags: lims-ui:scan
          cache-from: type=gha
      - uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: lims-ui:scan
          only-fixed: true
          severity-cutoff: high
          output-format: table
      - name: It serves the app and the help site with a read-only filesystem and no privileges
        run: |
          docker run -d --name ui --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges -p 127.0.0.1:8080:8080 -e API_URL=https://api.example.com lims-ui:scan
          timeout 30 sh -c 'until curl -sf http://localhost:8080/healthz; do sleep 1; done' || { docker logs ui; exit 1; }
          for p in / /help/ /config.js /third-party-notices.txt /help/third-party-notices.txt; do curl -sfo /dev/null "http://localhost:8080$p"; done
          [ "$(docker exec ui id -u)" = 101 ]
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # What is inside and how it was built, kept with the image.
          sbom: true
          provenance: mode=max
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
