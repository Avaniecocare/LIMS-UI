# Security headers for every response. nginx drops ALL inherited add_header directives in a block
# that has its own add_header, so every location that adds one (Cache-Control) includes this file.
# $csp is set once in the server block (default.conf.template).
add_header Content-Security-Policy $csp always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy no-referrer always;
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
add_header X-Frame-Options DENY always;
add_header X-Robots-Tag "noindex, nofollow" always;
